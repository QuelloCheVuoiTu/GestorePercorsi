name: 🐶 Snyk Security
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

jobs:
  snyk-scan:
    name: Snyk Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Tools (Universal)
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Install Snyk CLI
        run: npm install -g snyk snyk-to-html

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: 🧠 Dynamic Dependency Resolution
        continue-on-error: true
        run: |
          if [ -f "pom.xml" ]; then mvn install -DskipTests --no-transfer-progress || true; fi
          if [ -f "package.json" ]; then npm install --ignore-scripts || true; fi
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
          if [ -f "go.mod" ]; then go mod download || true; fi

      - name: Run Snyk Test
        continue-on-error: false
        run: |
          echo "Running Snyk (Threshold: medium)"
          snyk test --all-projects --severity-threshold=medium --json > snyk_report.json || true

      - name: Generate Report
        if: always()
        run: snyk-to-html -i snyk_report.json -o snyk_report.html || echo "Report generation failed"

      - name: Snyk Monitor
        if: always()
        run: snyk monitor --all-projects || true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with: { name: snyk-security-report, path: snyk_report.html }
