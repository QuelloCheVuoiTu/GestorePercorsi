name: 🐶 Snyk Security
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

jobs:
  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Snyk CLI
        run: npm install -g snyk snyk-to-html

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Test
        continue-on-error: true # Continua per generare il report HTML
        run: |
          # Scansiona tutti i progetti rilevati con soglia medium
          snyk test --all-projects --severity-threshold=medium --json > snyk_report.json || true

          # Genera HTML report
          snyk-to-html -i snyk_report.json -o snyk_report.html

      - name: Snyk Monitor (Dashboard)
        continue-on-error: true
        run: snyk monitor --all-projects || true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with: { name: snyk-security-report, path: snyk_report.html }
