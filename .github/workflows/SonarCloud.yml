name: 📡 SonarCloud Analysis
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

jobs:
  sonar-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Setup Environment (Universal)
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.21' }

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: 🧠 Dynamic Build & Config
        id: build-config
        continue-on-error: true 
        run: |
          JAVA_BIN="**/bin"

          if [ -f "pom.xml" ]; then 
            echo "Maven detected. Building..."
            mvn clean verify -DskipTests --no-transfer-progress || true
            JAVA_BIN="**/target/classes"

          elif [ -f "gradlew" ]; then 
            echo "Gradle detected. Building..."
            chmod +x gradlew
            ./gradlew assemble --no-daemon || true
            JAVA_BIN="**/build/classes"

          elif [ -f "package.json" ]; then 
            echo "Node detected. Installing..."
            npm install --ignore-scripts || true

          elif [ -f "go.mod" ]; then 
            echo "Go detected. Building..."
            go build ./... || true

          elif [ -f "requirements.txt" ]; then 
            echo "Python detected. Installing..."
            pip install -r requirements.txt || true

          elif [ -f "*.sln" ]; then 
            echo "Dotnet detected. Building..."
            dotnet build || true
          fi

          echo "Determined Java Binaries Path: $JAVA_BIN"
          echo "java_bin=$JAVA_BIN" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=false
            -Dsonar.java.binaries=${{ steps.build-config.outputs.java_bin }}
