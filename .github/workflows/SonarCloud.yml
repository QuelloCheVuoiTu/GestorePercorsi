name: 📡 SonarCloud Analysis
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '.github/workflows/**'
      - 'sonar-project.properties'
  workflow_dispatch:

jobs:
  sonar-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-go@v5
        with: { go-version: '1.21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: 🧠 Auto-Detect & Build
        continue-on-error: true 
        run: |
          if [ -f "pom.xml" ]; then mvn clean verify -DskipTests --no-transfer-progress; 
          elif [ -f "gradlew" ]; then chmod +x gradlew && ./gradlew assemble --no-daemon;
          elif [ -f "package.json" ]; then npm install --ignore-scripts;
          elif [ -f "go.mod" ]; then go build ./...;
          elif [ -f "requirements.txt" ]; then pip install -r requirements.txt;
          elif [ -f "*.sln" ]; then dotnet build;
          else echo "⚠️ No build file found. Analyzing source only."; fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.verbose=false
